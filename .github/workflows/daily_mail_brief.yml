name: Daily Mail Brief

on:
  # Auslösung erfolgt punktlich um 06:00 Europe/Berlin durch einen externen
  # Cron-Dienst (cron-job.org) via workflow_dispatch-API. Der GitHub-eigene
  # schedule-Cron ist bewusst deaktiviert, weil er bei Last 4–7 h verspätet
  # feuert (siehe Obsidian-Notiz "Daily Mail Brief", Abschnitt 6.3).
  # Zum Reaktivieren als Fallback einfach den schedule-Block einkommentieren:
  # schedule:
  #   - cron: "0 4 * * *"   # 04:00 UTC = 06:00 MESZ / 05:00 MEZ
  workflow_dispatch:  # extern (cron-job.org) + manuell über GitHub UI

jobs:
  generate-brief:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: pip install anthropic beautifulsoup4

      - name: Daily Mail Brief generieren
        env:
          NETCOLOGNE_PASSWORD: ${{ secrets.NETCOLOGNE_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_mail_brief.py

      - name: Datum setzen
        run: echo "DATE=$(date +'%d.%m.%Y')" >> $GITHUB_ENV

      - name: HTML-Datei als Artifact speichern
        uses: actions/upload-artifact@v7
        with:
          name: daily-brief-${{ github.run_id }}
          path: output/daily_brief.html
          retention-days: 7

      - name: Brief per E-Mail senden
        uses: dawidd6/action-send-mail@v17
        with:
          server_address: mail.netcologne-hosting.de
          server_port: 587
          username: newsletter@raab.koeln
          password: ${{ secrets.NETCOLOGNE_PASSWORD }}
          subject: "Daily Mail Brief – ${{ env.DATE }}"
          to: daniel@raab.koeln
          from: newsletter@raab.koeln
          html_body: file://output/daily_brief.html
